<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vintage Story</title>
<style>
:root{--bg:#1d1a16;--card:#2a251f;--tx:#ece3d3;--mut:#a89c88;--ac:#d9a441;--ln:#40382d;--ok:#7fc77f;--no:#c9786b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:16px;max-width:1300px;margin-inline:auto}
h1{margin:0 0 4px;color:var(--ac)} .sub{color:var(--mut);margin-bottom:12px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
button{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 14px;font-size:16px;cursor:pointer}
button.on{background:var(--ac);color:#1d1a16;font-weight:700}
.two{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);gap:16px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:19px;color:var(--ac)} .card h3{margin:0 0 6px;font-size:15px;color:var(--ac)}
.meta{color:var(--mut);font-size:13px;margin-bottom:6px}
.item{display:inline-flex;align-items:center;gap:6px;background:#352e26;border:1px solid var(--ln);border-radius:20px;padding:3px 4px 3px 12px;margin:3px 3px 3px 0;font-size:14px}
.item.has{border-color:var(--ac);background:#4a3b22}
.item button{padding:0 9px;font-size:16px;border-radius:50%;line-height:24px;height:26px}
.item span.c{min-width:18px;text-align:center;font-weight:700;color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--ln)}
.row b{white-space:nowrap;color:var(--ac)} .opt{color:var(--mut)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:8px 0 2px}
.note{font-size:13px;color:var(--mut);margin-top:8px}
.ok{color:var(--ok)} .no{color:var(--no)}
.res{border-left:4px solid var(--ok)} .res.bad{border-left-color:var(--ln);opacity:.75}
.big{font-size:22px;font-weight:700}
.empty{color:var(--mut);padding:20px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
footer{margin-top:18px;color:var(--mut);font-size:12px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
label{cursor:pointer}
</style></head><body>

const RC=[

{n:{de:"🍜 Suppe",en:"🍜 Soup"},req:[isV],reqT:{de:"1× Gemüse + Wasser",en:"1× vegetable + water"},opt:[x=>isV(x)||isM(x)||isE(x)],max:3,caps:[[x=>isM(x)||isE(x),1]],water:true},

];
function tryAlloc(r,N,water){
 const rem={};I.forEach(x=>rem[x.id]=has.get(x.id)||0);
 const slots=[];
 if(r.water&&!water)return null;
 for(const p of r.req){
  const c=I.filter(x=>p(x)&&rem[x.id]>=N).sort((a,b)=>a.sat-b.sat);
  if(!c.length)return null;
  const pick=c[c.length-1];rem[pick.id]-=N;slots.push({it:pick,n:N,req:1});
 }
 if(r.jam){if(rem.honey<2*N)return null;return {slots,honey:2*N};}
 const used=[];
 for(let k=0;k<r.max;k++){
  const p=r.opt[0];
  const c=I.filter(x=>p(x)&&rem[x.id]>=N&&r.caps.every(([f,m])=>!f(x)||slots.concat(used).filter(s=>f(s.it)).length<m)).sort((a,b)=>b.sat-a.sat);
  if(!c.length)break;
  rem[c[0].id]-=N;used.push({it:c[0],n:N});
 }
 return {slots:slots.concat(used)};
}
function solve(r,water){for(let N=6;N>=1;N--){const a=tryAlloc(r,N,water);if(a)return {N,a};}return null;}
function why(r,water){
 const m=[];
 if(r.water&&!water)m.push(t("wmiss"));
 const cnt=p=>I.filter(p).reduce((s,x)=>s+(has.get(x.id)||0),0);
 if(r.jam){if(cnt(isF)<2)m.push(t("fruit2"));if((has.get("honey")||0)<2)m.push(t("honey2"));return m;}
 const have=cnt(r.req[0]);
 if(have<r.req.length)m.push(`${r.reqT[lang]} (${t("youHave")} ${have})`);
 else if(!m.length)m.push(t("equal"));
 return m;
}
const sat=s=>s.a.slots.reduce((q,x)=>q+x.it.sat,0);
const $=id=>document.getElementById(id);
const fmt=x=>(Math.round(x*10)/10).toString().replace(".",lang==="de"?",":".");

function renderInv(){
 let h="";
 for(const c in D[lang].cat){
  h+=`<div class="card"><h3>${t("cat")[c]}</h3>`;
  I.filter(x=>x.cat===c).forEach(x=>{
   const n=has.get(x.id)||0;
   h+=`<span class="item ${n?"has":""}">${nm(x)}<button data-a="-" data-i="${x.id}">−</button><span class="c">${n}</span><button data-a="+" data-i="${x.id}">+</button></span>`;
  });
  h+="</div>";
 }
 $("inv").innerHTML=h;
}
function renderOut(){
 const water=$("water").checked;
 const total=[...has.values()].reduce((a,b)=>a+b,0);
 if(!total){$("out").innerHTML=`<div class="card empty">${t("hint")}</div>`;return;}
 const ok=[],bad=[];
 RC.forEach(r=>{const s=solve(r,water);(s?ok:bad).push({r,s});});
 ok.sort((a,b)=>sat(b.s)-sat(a.s));
 let h=`<div class="lbl">${t("poss")} (${ok.length})</div>`;
 if(!ok.length)h+=`<div class="card empty">${t("none")}</div>`;
 ok.forEach(({r,s})=>{
  const rows=s.a.slots.map((x,i)=>`<div class="row ${x.req?"":"opt"}"><span>${t("slot")} ${i+1}${x.req?"":" ("+t("optional")+")"}: ${nm(x.it)}</span><b>${x.n}×</b></div>`).join("");
  const liq=(r.water?`<div class="row"><span>${t("water1")}</span><b>${s.N} L</b></div>`:"")+(s.a.honey?`<div class="row"><span>${t("honeyJam")}</span><b>${fmt(s.a.honey*0.2)} L</b></div>`:"");
  h+=`<div class="card res"><h2>${r.n[lang]}</h2><div class="meta">${t("max")} <span class="ok big">${s.N}</span> ${s.N>1?t("portions"):t("portion")} · ≈ ${sat(s)} ${t("sat")}</div>${rows}${liq}</div>`;
 });
 h+=`<div class="lbl" style="margin-top:14px">${t("imposs")}</div>`;
 bad.forEach(({r})=>{
  h+=`<div class="card res bad"><h2>${r.n[lang]}</h2><div class="meta">${t("need")}: ${r.reqT[lang]}</div><div class="no" style="font-size:13px">${t("miss")}: ${why(r,water).join(", ")}</div></div>`;
 });
 $("out").innerHTML=h;
}
$("inv").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 const id=b.dataset.i,n=(has.get(id)||0)+(b.dataset.a==="+"?1:-1);
 if(n<=0)has.delete(id);else has.set(id,n);
 const y=scrollY;renderInv();renderOut();if(tab===3)renderOven();scrollTo(0,y);
});
$("clr").onclick=()=>{has.clear();renderInv();renderOut();if(tab===3)renderOven()};

}

const BREAD={flax:[70,160,100],rice:[160,330,220]};
const bs=id=>BREAD[id]||[150,300,210];
function pieTypes(){
 const cnt=x=>has.get(x.id)||0;
 const layersOf=f=>I.filter(f).flatMap(x=>Array(Math.floor(cnt(x)/2)).fill(x)).sort((a,b)=>b.sat-a.sat);
 const meat=layersOf(isM),veg=layersOf(x=>isV(x)&&x.id!=="mush"),fruit=layersOf(isF),cheese=layersOf(isC);
 const out=[];
 [["pmeat",meat],["pveg",veg],["pfruit",fruit],["pcheese",cheese]].forEach(([k,l])=>out.push({k,layers:l.slice(0,4),n:Math.floor(l.length/4),ok:l.length>=4,have:l.length}));
 let pot={k:"ppot",ok:false,n:0,layers:[],have:meat.length+veg.length};
 if(meat.length&&veg.length&&meat.length+veg.length>=4){
  const rest=meat.slice(1).concat(veg.slice(1)).sort((a,b)=>b.sat-a.sat);
  pot.layers=[meat[0],veg[0]].concat(rest.slice(0,2));pot.ok=true;pot.n=Math.floor((meat.length+veg.length)/4);
 }
 out.push(pot);return out;
}

 h+=`</div><div class="card">${t("ov").pie}</div><div class="lbl">${t("ov").ph}</div>`;
 const P=pieTypes(),ok=P.filter(p=>p.ok);
 if(!has.size||!ok.length)h+=`<div class="card empty">${t("ov").pnone}</div>`;
 const cat={pmeat:"protein",pveg:"vegetable",pfruit:"fruit",pcheese:"dairy",ppot:"protein + vegetable"};
 ok.forEach(p=>{
  const tot=p.layers.reduce((q,x)=>q+2*x.sat,0);
  const rows=p.layers.map((x,i)=>`<div class="row"><span>${t("ov").layer} ${i+1}: ${nm(x)}</span><b>2×</b></div>`).join("");
  h+=`<div class="card res"><h2>${t("ov")[p.k]}</h2><div class="meta">${t("ov").maxpies.replace("{n}",p.n)}</div>${rows}
  <div class="row"><span>${t("ov").bottom}</span><b>2 ${t("ov").dough}</b></div><div class="row opt"><span>${t("ov").top}</span><b>+2 ${t("ov").dough}</b></div>
  <div class="row"><span>${t("ov").flour} / ${t("ov").water}</span><b>2–4 / 2–4 L</b></div>
  <div class="meta" style="margin-top:6px">${t("ov").total}: ≈ ${tot} (${cat[p.k]}) · ${t("ov").slice}: ≈ ${Math.round(tot/4)}</div></div>`;
 });
 $("oven").innerHTML=h;
}
